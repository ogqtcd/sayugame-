<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>데이트를 도와줘!!!</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" crossorigin="anonymous"></script>
<style>
/* ★ 가져온 폰트 파일을 fonts/game.ttf (또는 .woff2/.otf)로 넣으면 자동 적용돼 */
@font-face{font-family:GameFont;src:url('fonts/game.woff2'),url('fonts/game.ttf'),url('fonts/game.otf')}
:root{--f:GameFont,Galmuri11,'Malgun Gothic',monospace}
html,body{margin:0;height:100%;background:#1b1838;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:var(--f);color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#w{position:relative;width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;box-sizing:border-box;border:3px solid #f6e7b4;border-radius:6px;background:#8b9be0}

.logo{font-size:2.1em;color:#ffee40;text-shadow:3px 3px #ff8a20,6px 6px #b040a0;margin:0 0 .5em;line-height:1.25}
.tx{font-size:1.25em;line-height:1.8;padding:0 14px;min-height:3em}
.pb{display:block;margin:.3em auto;width:15em;padding:.5em 0;font:700 1em var(--f);color:#fff;border:3px solid #2b2250;border-radius:22px;text-shadow:0 2px #0006;box-shadow:0 4px #2b2250}
.pb:active{transform:translateY(3px);box-shadow:0 1px #2b2250}.pk{background:#e040b0}.bl{background:#20a8e8}.gr{background:#30b850}.yl{background:#e0a010}
#rot{display:none;position:fixed;inset:0;background:#1b1838;z-index:99;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:18px;line-height:1.8}
@media(orientation:portrait) and (pointer:coarse){#rot{display:flex}}
#ctl{display:none;position:absolute;inset:0;pointer-events:none}
@media(pointer:coarse){#ctl.on{display:block}}
#stick{position:absolute;left:3%;bottom:7%;width:104px;height:104px;border-radius:50%;background:#ffffff22;border:4px solid #f6e7b4;pointer-events:auto;touch-action:none;opacity:.8}
#knob{position:absolute;left:26px;top:26px;width:46px;height:46px;border-radius:50%;background:#20a8e8;border:3px solid #fff;pointer-events:none}
#jb{position:absolute;right:3%;bottom:8%;width:84px;height:84px;border-radius:50%;border:4px solid #2b2250;background:#30b850;pointer-events:auto;opacity:.85;padding:0;display:flex;align-items:center;justify-content:center}
#jb svg{width:44px;height:44px}
#err{position:fixed;left:4px;top:4px;color:#f66;font:10px monospace;z-index:100;max-width:90vw;pointer-events:none}
input{font:24px var(--f);width:130px;text-align:center;margin:8px}small{opacity:.8}
</style></head><body>
<div id="w"><canvas id="c" width="480" height="270"></canvas><div id="ctl"><div id="stick"><div id="knob"></div></div><button id="jb"><svg viewBox="0 0 24 24"><path d="M12 3L21 13H15V21H9V13H3Z" fill="#fff"/></svg></button></div><div id="ov" class="ov"></div></div>
<div id="rot"><div style="font-size:48px">📱↻</div>폰을 가로로 돌려줘!<br><small>가로 화면에서만 플레이할 수 있어</small></div><div id="err"></div>
<script>
// ★ 영상/BGM 경로 (순서: 걷다가 → 개인미션 뒤 → 낚시 뒤 → 마지막미션 뒤 → 집)
const VIDEOS=['video/v1.mp4','video/v2.mp4','video/v3.mp4','video/v4.mp4','video/v5.mp4'];
const BGM_SRC='audio/bgm.mp3';
const $=id=>$$[id]||($$[id]=document.getElementById(id));const $$={};
const cv=$('c'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
const F="GameFont,Galmuri11,'Malgun Gothic',monospace",GY=240;
const IMG=n=>{const i=new Image();i.src=n;return i},SP={yushi:IMG('assets/yushi_s.png'),sakuya:IMG('assets/sakuya_s.png')};
const bgm=new Audio(BGM_SRC);bgm.loop=true;bgm.volume=.5;
function r(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)}
function txt(s,x,y,sz,c,al='center'){g.font=sz+'px '+F;g.textAlign=al;g.fillStyle=c;g.fillText(s,Math.round(x),Math.round(y))}
const H=i=>((Math.sin(i*127.1)*43758.5453)%1+1)%1;
const hx=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
function mix(a,b,t){const A=hx(a),B=hx(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join()+')'}
const PAL=[['#8ad4f8','#d8f0ff'],['#5bb4f0','#bfe6ff'],['#f0a860','#ffe0a8'],['#7a4a9a','#f08a70'],['#10143a','#2a2a6a']],STOPS=[0,1000,1900,2600,3300];
function tod(x){let i=0;while(i<4&&x>STOPS[i+1])i++;if(i>=4)return{a:PAL[4][0],b:PAL[4][1],n:1};const t=Math.max(0,Math.min(1,(x-STOPS[i])/(STOPS[i+1]-STOPS[i])));return{a:mix(PAL[i][0],PAL[i+1][0],t),b:mix(PAL[i][1],PAL[i+1][1],t),n:(i+t)/4}}
const EV=[{k:'walk',x:650,lim:760,v:0},{k:'indiv',x:1250,lim:1420,v:1},{k:'fish',x:2000,lim:2100,v:2},{k:'run',x:2700,lim:2800,v:3},{k:'home',x:3400,lim:3480,v:4}];
const SD=1160,PD=1340,FD=2000,SH=2700,HD=3400,RL=1720,GOAL=1600;
const OBS=[{x:360,w:28,h:28},{x:560,w:28,h:36},{x:760,w:56,h:28},{x:960,w:28,h:36},{x:1180,w:28,h:28},{x:1380,w:56,h:36}];
const RC=[{x:250,y:GY-18},{x:374,y:GY-62},{x:574,y:GY-72},{x:788,y:GY-62},{x:980,y:GY-72},{x:1210,y:GY-62}];
let net=false,isHost=true,conn=null,peer=null,local=0,gready=0,hready=0,sc='st',ev=0,M={},P=[],cam=0,score=0,t=0,DT=0,acts=[0,0],keys={},paused=true,started=false,last=0,msg='',mt=0,sq=0,sp=[60,100],vflag=null,vcb=null,fadeA=0,sT=0,pT=0,NN=0;
const ANY={l:['a','ArrowLeft','pL'],r:['d','ArrowRight','pR'],j:['w','ArrowUp','pJ'],a:['f','Enter',' ','pA']};
const K=d=>ANY[d].some(k=>keys[k]);
function press(){if(!started||paused)return;if(net&&!isHost)send({t:'a'});else acts[local]++}
function kd(k,rep){keys[k]=1;if(!rep&&ANY.a.includes(k))press()}
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();kd(e.key,e.repeat)});addEventListener('keyup',e=>keys[e.key]=0);
// 조이스틱 + 버튼
const stk=$('stick'),knb=$('knob');let sid=null;
function sm(e){const b=stk.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),m=Math.min(30,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);knb.style.transform='translate('+Math.cos(a)*m+'px,'+Math.sin(a)*m+'px)';keys.pL=dx<-14;keys.pR=dx>14}
stk.onpointerdown=e=>{sid=e.pointerId;stk.setPointerCapture(sid);sm(e)};stk.onpointermove=e=>{if(e.pointerId==sid)sm(e)};
stk.onpointerup=stk.onpointercancel=()=>{sid=null;keys.pL=keys.pR=false;knb.style.transform=''};
$('jb').onpointerdown=e=>{e.preventDefault();keys.pJ=1};$('jb').onpointerup=$('jb').onpointerleave=$('jb').onpointercancel=()=>keys.pJ=0;
cv.onpointerdown=()=>press();
addEventListener('error',e=>{$('err').textContent='오류: '+e.message+' '+(e.filename||'').split('/').pop()+':'+e.lineno});
// UI
function ov(html,bg){const o=$('ov');o.onclick=null;o.style.transition='';o.style.display='flex';o.style.background=bg||'#000d';o.style.opacity=1;o.innerHTML=html;return o}
function init(){P=[0,1].map(i=>({id:i,n:i?'yushi':'sakuya',x:60+i*40,y:GY,vy:0,fl:0,mvT:0}))}
function title(){ov('<div class="logo">데이트를<br>도와줘!!!</div><button class="pb pk" id="b1">솔로 · 사쿠야</button><button class="pb bl" id="b2">솔로 · 유우시</button><button class="pb gr" id="b3">온라인 2인 · 방 만들기</button><button class="pb yl" id="b4">온라인 2인 · 방 참가</button>');
 $('b1').onclick=()=>{local=0;init();story()};$('b2').onclick=()=>{local=1;init();story()};
 $('b3').onclick=()=>{ov('<div class="tx">내 캐릭터는?</div><button class="pb pk" id="c0">사쿠야</button><button class="pb bl" id="c1">유우시</button>');$('c0').onclick=()=>hostRoom(0);$('c1').onclick=()=>hostRoom(1)};
 $('b4').onclick=()=>{ov('<div class="tx">방 코드 4자리</div><input id="cd" inputmode="numeric" maxlength="4"><button class="pb gr" id="jg">입장</button>');$('jg').onclick=()=>joinRoom($('cd').value)}}
const LINES=['오늘은 사쿠야와 유우시의 데이트 날이야!','둘의 데이트를 완벽하게 만들어줘!!'];
function story(){bgm.play().catch(()=>{});try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}let li=0,ci=0,tm;const o=ov('<div id="tx" class="tx"></div><small>▼ 화면을 눌러줘</small>','#10143aee');const tx=$('tx');
 const type=()=>{clearInterval(tm);ci=0;tx.textContent='';tm=setInterval(()=>{tx.textContent=LINES[li].slice(0,++ci);if(ci>=LINES[li].length)clearInterval(tm)},55)};type();
 o.onclick=()=>{if(ci<LINES[li].length){clearInterval(tm);ci=LINES[li].length;tx.textContent=LINES[li];return}li++;if(li>=LINES.length){o.onclick=null;loading()}else type()}}
function loading(){ov('<div class="tx" style="color:#222">로딩중<span id="dt">.</span></div>','#fff');let n=0;const iv=setInterval(()=>{const d=document.getElementById('dt');if(d)d.textContent='.'.repeat(1+(++n%3))},350);setTimeout(()=>{clearInterval(iv);ready()},1900)}
function ready(){if(!net)launch();else if(isHost){hready=1;if(gready)goNow();else $('ov').innerHTML='<div class="tx" style="color:#222">친구를 기다리는 중…</div>'}else{send({t:'ready'});$('ov').innerHTML='<div class="tx" style="color:#222">친구를 기다리는 중…</div>'}}
function goNow(){send({t:'go'});launch()}
function launch(){const o=$('ov');o.style.transition='opacity .6s';o.style.opacity=0;setTimeout(()=>{o.style.display='none'},600);started=true;paused=false;$('ctl').classList.add('on')}
// 영상
function showVid(i,fin){const o=ov('<div id="vb"></div><button class="pb gr" id="vn">계속하기 ▶</button>');let d=0;const done=()=>{if(d)return;d=1;o.style.display='none';fin()};$('vn').onclick=done;
 const v=document.createElement('video');v.src=VIDEOS[i];v.muted=true;v.defaultMuted=true;v.playsInline=true;v.autoplay=true;v.style.cssText='max-width:100%;max-height:40vh;border:3px solid #f6e7b4';v.onended=done;
 v.onerror=()=>{$('vb').innerHTML='🎬 영상 자리<br><small>'+VIDEOS[i]+'<br>파일을 넣으면 자동 재생돼 (소리는 꺼져 있어)</small>'};$('vb').appendChild(v)}
function vid(i,cb){paused=true;vcb=cb||null;vflag={h:0,g:net?0:1};if(net)send({t:'vid',i});showVid(i,()=>{vflag.h=1;chkV()})}
function chkV(){if(vflag.h&&vflag.g){paused=false;acts=[0,0];const c=vcb;vcb=null;if(net)send({t:'rs'});c&&c()}}
let ended=0;function end(s){$('ctl').classList.remove('on');ended=1;paused=true;started=false;if(net&&isHost)send({t:'end',s});const w=s>=6;ov('<div class="logo" style="font-size:1.6em">'+(s>=10?'만점!!':w?'승리!':'아쉬워…')+'</div><div style="font-size:1.1em">코인 '+s+' / 10</div><div style="margin:.6em;font-size:.85em">'+(w?'데이트 대성공! 🎉':'6개 이상이면 승리야. 한 번 더 해볼까?')+'</div><button class="pb gr" onclick="location.reload()">다시하기</button>')}
// 온라인 (PeerJS / WebRTC)
const ICE={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}]}};
const send=o=>{if(conn&&conn.open)conn.send(o)};
const fail=m=>ov('<div class="tx">'+m+'</div><button class="pb gr" onclick="location.reload()">처음으로</button>');
function hostRoom(c){if(typeof Peer=='undefined')return fail('온라인 모듈을 못 불러왔어. 인터넷을 확인해줘!');local=c;const code=String(1000+Math.floor(Math.random()*9000));
 try{peer=new Peer('datehelp-'+code,ICE)}catch(e){return fail('연결 모듈 오류: '+e.message)}peer.on('open',()=>ov('<div class="tx">방 코드<br><span style="font-size:2.4em;color:#ffee40">'+code+'</span><br><small>친구에게 알려주고 기다려줘</small></div>'));
 peer.on('connection',cn=>{conn=cn;net=true;isHost=true;cn.on('open',()=>{init();send({t:'cfg',me:1-c});story()});cn.on('data',onData);cn.on('close',lost)});
 peer.on('error',e=>e.type=='unavailable-id'?hostRoom(c):fail('연결 오류: '+e.type))}
function joinRoom(code){if(typeof Peer=='undefined')return fail('온라인 모듈을 못 불러왔어. 인터넷을 확인해줘!');ov('<div class="tx">연결 중…</div>');try{peer=new Peer(undefined,ICE)}catch(e){return fail('연결 모듈 오류: '+e.message)}
 peer.on('open',()=>{conn=peer.connect('datehelp-'+code,{reliable:true,serialization:'json'});conn.on('open',()=>{net=true;isHost=false;ov('<div class="tx">연결됐어!<br>시작을 기다리는 중…</div>')});conn.on('data',onData);conn.on('close',lost)});
 peer.on('error',e=>fail(e.type=='peer-unavailable'?'그 방을 못 찾았어. 코드를 다시 확인해줘!':'연결 오류: '+e.type))}
const lost=()=>{if(!ended)fail('연결이 끊겼어 ㅠㅠ')};
function snapCam(){cam=sc=='run'?0:2460}
function onData(m){const q=P[1-local];
 if(m.t=='cfg'){local=m.me;init();story()}
 else if(m.t=='ready'){gready=1;if(hready)goNow()}
 else if(m.t=='go')launch();
 else if(m.t=='p'&&q){q.tx=m.x;q.ty=m.y;q.fl=m.f;q.mvT=m.m?t:0}
 else if(m.t=='a')acts[1-local]++;
 else if(m.t=='vd'){if(vflag){vflag.g=1;chkV()}}
 else if(m.t=='vid'){paused=true;showVid(m.i,()=>send({t:'vd'}))}
 else if(m.t=='rs')paused=false;
 else if(m.t=='end')end(m.s);
 else if(m.t=='S'){ev=m.ev;if(m.sc!=sc){sc=m.sc;snapCam();fadeA=1}M=m.M;score=m.s;msg=m.msg;mt=m.mt;
  if(m.sq!=sq){sq=m.sq;P[local].x=m.sp[local];P[local].y=GY;P[local].vy=0}
  if(q){q.tx=m.p[1-local][0];q.ty=m.p[1-local][1];q.fl=m.p[1-local][2];q.mvT=m.p[1-local][3]?t:0}}}
function netTick(dt){if(!net||!started)return;sT+=dt;pT+=dt;
 if(isHost&&sT>.083){sT=0;send({t:'S',ev,sc,M,s:score,msg,mt,sq,sp,p:P.map(p=>[Math.round(p.x),Math.round(p.y),p.fl,p.mvT?1:0])})}
 if(!isHost&&pT>.05){pT=0;const p=P[local];send({t:'p',x:Math.round(p.x),y:Math.round(p.y),f:p.fl,m:p.mvT?1:0})}}
// 물리
const obsList=()=>sc=='run'?OBS:[];
function flr(p){let f=GY;obsList().forEach(o=>{if(p.x+8>o.x&&p.x-8<o.x+o.w&&p.y<=GY-o.h+8)f=Math.min(f,GY-o.h)});return f}
function mv(p,dt,dx,j,spd=115){if(dx)p.fl=dx<0?1:0;p.mvT=dx?p.mvT+dt:0;p.x+=dx*spd*dt;
 obsList().forEach(o=>{if(p.x+8>o.x&&p.x-8<o.x+o.w&&p.y>GY-o.h+8)p.x=p.x<o.x+o.w/2?o.x-8:o.x+o.w+8});
 const f=flr(p);if(j&&p.y>=f)p.vy=-330;p.vy+=900*dt;p.y=Math.min(f,p.y+p.vy*dt);if(p.y>=f)p.vy=0;
 const lim=sc=='run'?RL:EV[ev].lim;p.x=Math.max(cam+16,Math.min(cam+464,Math.min(p.x,lim)))}
function camUpd(dt){const lim=sc=='run'?RL:EV[ev].lim,av=(P[0].x+P[1].x)/2;cam+=(Math.max(0,Math.min(av-240,lim-330))-cam)*Math.min(1,dt*6)}
function spawn(xs){sp=xs;sq++;P.forEach((p,i)=>{p.x=xs[i];p.tx=xs[i];p.y=GY;p.vy=0})}
function setSc(s){sc=s;snapCam();fadeA=1}
function update(dt){const a=P[local],o=P[1-local];mv(a,dt,(K('r')?1:0)-(K('l')?1:0),K('j'));
 if(!net){const e=EV[ev];let tx=a.x-36;if(sc=='st'&&e.k=='indiv'&&a.x>950)tx=o.n=='yushi'?SD:PD;const d=tx-o.x,dx=Math.abs(d)>8?Math.sign(d)*.85:0;
  mv(o,dt,dx,sc=='run'&&dx>0&&OBS.some(b=>b.x-o.x>0&&b.x-o.x<30)?1:0,100)}
 else{const q=P[1-local];if(q.tx!=null){q.x+=(q.tx-q.x)*Math.min(1,dt*14);q.y+=(q.ty-q.y)*Math.min(1,dt*14)}}
 camUpd(dt);if(isHost)missions(dt)}
const done=()=>{M.dn=1;msg='MISSION CLEAR!';mt=1.5};
function after(){const e=EV[ev];if(sc=='run'){setSc('st');spawn([2680,2720])}M={};ev++;vid(e.v)}
function missions(dt){if(mt>0)mt-=dt;const e=EV[ev],av=(P[0].x+P[1].x)/2;
 if(M.dn>0){M.dn-=dt;if(M.dn<=0)after();acts=[0,0];return}
 if(sc=='run'){RC.forEach((c,i)=>{if(!M.rc[i]&&P.some(p=>Math.abs(p.x-c.x)<16&&c.y<p.y+4&&c.y>p.y-52)){M.rc[i]=1;score++}});
  if(P.every(p=>Math.abs(p.x-GOAL)<90)){done();msg='GOAL!'}}
 else if(e.k=='walk'&&av>=e.x-40){ev++;M={};vid(e.v)}
 else if(e.k=='indiv'){const y=P[1],s=P[0];M.yn=M.yn||0;M.sp=M.sp==null?0:M.sp;M.sd=M.sd||1;
  if(!M.yok&&Math.abs(y.x-SD)<34){M.yn=Math.max(0,M.yn-1.2*dt);if(!net&&local!=1){M.yt=(M.yt||0)+dt;if(M.yt>.3){M.yt=0;M.yn++}}else M.yn+=acts[1];if(M.yn>=14){M.yok=1;score++}}
  if(!M.sok&&Math.abs(s.x-PD)<34){M.sp+=M.sd*dt*1.3;if(M.sp>1){M.sp=1;M.sd=-1}if(M.sp<0){M.sp=0;M.sd=1}
   if(!net&&local!=0){M.st=(M.st||0)+dt;if(M.st>2)M.sok=1}else if(acts[0]>0){if(Math.abs(M.sp-.5)<.12)M.sok=1;else{msg='아쉬워! 다시~';mt=.8}}if(M.sok)score++}
  if(M.yok&&M.sok)done()}
 else if(e.k=='fish'){if(!P.every(p=>Math.abs(p.x-FD)<100))M.f='idle';else{
  if(M.f!='wait'&&M.f!='bite'){M.f='wait';M.tm=1.5+Math.random()*2;M.rd=M.rd||0}
