<style>
/* ★ 가져온 폰트 파일을 fonts/game.ttf (또는 .woff2/.otf)로 넣으면 자동 적용돼 */
@font-face{font-family:GameFont;src:url('fonts/game.woff2'),url('fonts/game.ttf'),url('fonts/game.otf')}
:root{--f:GameFont,Galmuri11,'Malgun Gothic',monospace}
html,body{margin:0;height:100%;background:#1b1838;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:var(--f);color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#w{position:relative;width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;box-sizing:border-box;border:3px solid #f6e7b4;border-radius:6px;background:#8b9be0}
.ov{position:absolute;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;line-height:1.5;font-size:clamp(11px,3.6vh,16px);border-radius:6px}
.logo{font-size:2.1em;color:#ffee40;text-shadow:3px 3px #ff8a20,6px 6px #b040a0;margin:0 0 .5em;line-height:1.25}
.tx{font-size:1.25em;line-height:1.8;padding:0 14px;min-height:3em}
.pb{display:block;margin:.3em auto;width:15em;padding:.5em 0;font:700 1em var(--f);color:#fff;border:3px solid #2b2250;border-radius:22px;text-shadow:0 2px #0006;box-shadow:0 4px #2b2250}
.pb:active{transform:translateY(3px);box-shadow:0 1px #2b2250}.pk{background:#e040b0}.bl{background:#20a8e8}.gr{background:#30b850}.yl{background:#e0a010}
#rot{display:none;position:fixed;inset:0;background:#1b1838;z-index:99;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:18px;line-height:1.8}
@media(orientation:portrait) and (pointer:coarse){#rot{display:flex}}
#ctl{display:none;position:absolute;inset:0;pointer-events:none}
@media(pointer:coarse){#ctl.on{display:block}}
#stick{position:absolute;left:3%;bottom:7%;width:104px;height:104px;border-radius:50%;background:#ffffff22;border:4px solid #f6e7b4;pointer-events:auto;touch-action:none;opacity:.8}
#knob{position:absolute;left:26px;top:26px;width:46px;height:46px;border-radius:50%;background:#20a8e8;border:3px solid #fff;pointer-events:none}
#jb{position:absolute;right:3%;bottom:8%;width:84px;height:84px;border-radius:50%;border:4px solid #2b2250;background:#30b850;pointer-events:auto;opacity:.85;padding:0;display:flex;align-items:center;justify-content:center}
#jb svg{width:44px;height:44px}
#err{position:fixed;left:4px;top:4px;color:#f66;font:10px monospace;z-index:100;max-width:90vw;pointer-events:none}
input{font:24px var(--f);width:130px;text-align:center;margin:8px}small{opacity:.8}
</style></head><body>

 if(isHost&&sT>.083){sT=0;send({t:'S',ev,sc,M,s:score,msg,mt,sq,sp,p:P.map(p=>[Math.round(p.x),Math.round(p.y),p.fl,p.mvT?1:0])})}
 if(!isHost&&pT>.05){pT=0;const p=P[local];send({t:'p',x:Math.round(p.x),y:Math.round(p.y),f:p.fl,m:p.mvT?1:0})}}
// 물리
const obsList=()=>sc=='run'?OBS:[];
function flr(p){let f=GY;obsList().forEach(o=>{if(p.x+8>o.x&&p.x-8<o.x+o.w&&p.y<=GY-o.h+8)f=Math.min(f,GY-o.h)});return f}
function mv(p,dt,dx,j,spd=115){if(dx)p.fl=dx<0?1:0;p.mvT=dx?p.mvT+dt:0;p.x+=dx*spd*dt;
 obsList().forEach(o=>{if(p.x+8>o.x&&p.x-8<o.x+o.w&&p.y>GY-o.h+8)p.x=p.x<o.x+o.w/2?o.x-8:o.x+o.w+8});
 const f=flr(p);if(j&&p.y>=f)p.vy=-330;p.vy+=900*dt;p.y=Math.min(f,p.y+p.vy*dt);if(p.y>=f)p.vy=0;
 const lim=sc=='run'?RL:EV[ev].lim;p.x=Math.max(cam+16,Math.min(cam+464,Math.min(p.x,lim)))}
function camUpd(dt){const lim=sc=='run'?RL:EV[ev].lim,av=(P[0].x+P[1].x)/2;cam+=(Math.max(0,Math.min(av-240,lim-330))-cam)*Math.min(1,dt*6)}
function spawn(xs){sp=xs;sq++;P.forEach((p,i)=>{p.x=xs[i];p.tx=xs[i];p.y=GY;p.vy=0})}
function setSc(s){sc=s;snapCam();fadeA=1}
function update(dt){const a=P[local],o=P[1-local];mv(a,dt,(K('r')?1:0)-(K('l')?1:0),K('j'));
 if(!net){const e=EV[ev];let tx=a.x-36;if(sc=='st'&&e.k=='indiv'&&a.x>950)tx=o.n=='yushi'?SD:PD;const d=tx-o.x,dx=Math.abs(d)>8?Math.sign(d)*.85:0;
  mv(o,dt,dx,sc=='run'&&dx>0&&OBS.some(b=>b.x-o.x>0&&b.x-o.x<30)?1:0,100)}
 else{const q=P[1-local];if(q.tx!=null){q.x+=(q.tx-q.x)*Math.min(1,dt*14);q.y+=(q.ty-q.y)*Math.min(1,dt*14)}}
 camUpd(dt);if(isHost)missions(dt)}
const done=()=>{M.dn=1;msg='MISSION CLEAR!';mt=1.5};
function after(){const e=EV[ev];if(sc=='run'){setSc('st');spawn([2680,2720])}M={};ev++;vid(e.v)}
function missions(dt){if(mt>0)mt-=dt;const e=EV[ev],av=(P[0].x+P[1].x)/2;
 if(M.dn>0){M.dn-=dt;if(M.dn<=0)after();acts=[0,0];return}
 if(sc=='run'){RC.forEach((c,i)=>{if(!M.rc[i]&&P.some(p=>Math.abs(p.x-c.x)<16&&c.y<p.y+4&&c.y>p.y-52)){M.rc[i]=1;score++}});
  if(P.every(p=>Math.abs(p.x-GOAL)<90)){done();msg='GOAL!'}}
 else if(e.k=='walk'&&av>=e.x-40){ev++;M={};vid(e.v)}
 else if(e.k=='indiv'){const y=P[1],s=P[0];M.yn=M.yn||0;M.sp=M.sp==null?0:M.sp;M.sd=M.sd||1;
  if(!M.yok&&Math.abs(y.x-SD)<34){M.yn=Math.max(0,M.yn-1.2*dt);if(!net&&local!=1){M.yt=(M.yt||0)+dt;if(M.yt>.3){M.yt=0;M.yn++}}else M.yn+=acts[1];if(M.yn>=14){M.yok=1;score++}}
  if(!M.sok&&Math.abs(s.x-PD)<34){M.sp+=M.sd*dt*1.3;if(M.sp>1){M.sp=1;M.sd=-1}if(M.sp<0){M.sp=0;M.sd=1}
   if(!net&&local!=0){M.st=(M.st||0)+dt;if(M.st>2)M.sok=1}else if(acts[0]>0){if(Math.abs(M.sp-.5)<.12)M.sok=1;else{msg='아쉬워! 다시~';mt=.8}}if(M.sok)score++}
  if(M.yok&&M.sok)done()}
 else if(e.k=='fish'){if(!P.every(p=>Math.abs(p.x-FD)<100))M.f='idle';else{
  if(M.f!='wait'&&M.f!='bite'){M.f='wait';M.tm=1.5+Math.random()*2;M.rd=M.rd||0}
  if(M.f=='wait'){M.tm-=dt;if(P.some(p=>(net||p.id==local)&&acts[p.id]>0)){M.tm+=1;msg='너무 빨라!';mt=.8}if(M.tm<=0){M.f='bite';M.tm=.85;M.pr=[0,0]}}
  else{M.tm-=dt;P.forEach(p=>{if((net||p.id==local)&&acts[p.id]>0)M.pr[p.id]=1;if(!net&&p.id!=local&&M.tm<.55)M.pr[p.id]=1});
   if(M.pr[0]&&M.pr[1]){M.rd++;score++;M.f='idle';msg='GET!';mt=1;if(M.rd>=2)done()}else if(M.tm<=0){M.f='idle';msg='놓쳤다! 다시~';mt=1}}}}
 else if(e.k=='run'&&P.every(p=>Math.abs(p.x-SH)<110)){setSc('run');spawn([60,100]);M={rc:RC.map(()=>0)};msg='코인을 모으며 골인!';mt=2.5}
 else if(e.k=='home'&&P.every(p=>Math.abs(p.x-HD)<90)){sc='home';fadeA=1;vid(e.v,()=>end(score))}
 acts=[0,0]}
// 그리기
function bld(x,w,roof,label,h=96){x-=cam;if(x>480||x+w<0)return;const y=236-h,rh=30;r(x,y,w,h,'#fff3d6');r(x-4,y-4,w+8,rh+4,roof);r(x-4,y+rh-4,w+8,4,'#0003');
 r(x+w/2-30,y+8,60,14,'#6b4423');txt(label,x+w/2,y+19,11,'#fff');
 [x+8,x+w-28].forEach(wx=>{r(wx,y+rh+10,20,18,'#7a5230');r(wx+2,y+rh+12,16,14,NN>.55?'#ffe28a':'#a8e0f4');r(wx+9,y+rh+12,2,14,'#7a5230')});
 r(x+w/2-12,206,24,30,'#7a4a28');r(x+w/2-9,209,18,27,'#b8764a')}
function bar(x,y,w,v,c){r(x-1,y-1,w+2,9,'#1b1838');r(x,y,w,7,'#fff');r(x,y,Math.round(w*Math.min(1,v)),7,c)}
function sky(td){const gr=g.createLinearGradient(0,0,0,236);gr.addColorStop(0,td.a);gr.addColorStop(1,td.b);g.fillStyle=gr;g.fillRect(0,0,480,270)}
function hill(cx,R,c){for(let dy=-R;dy<0;dy+=4){const w=Math.round(Math.sqrt(R*R-dy*dy)*2/4)*4;r(cx-w/2,240+dy,w,4,c)}}
function drawStreet(){const td=tod(cam+240);NN=td.n;sky(td);
 if(td.n>.6){g.globalAlpha=Math.min(1,(td.n-.6)*3);for(let i=0;i<24;i++)r((i*97)%480,(i*41)%110,2,2,'#fff');g.globalAlpha=1}
 let o=cam*.25;for(let i=Math.floor(o/50)-1;i<(o+480)/50+2;i++){const hh=60+H(i)*90,x=i*50-o;r(x,236-hh,44,hh,mix('#6a7aa8','#1a1a44',td.n));
  for(let a=0;a<Math.floor((hh-14)/14);a++)for(let b=0;b<3;b++)if(H(i*31+a*7+b)<.3+td.n*.4)r(x+6+b*12,236-hh+8+a*14,5,7,td.n>.55?'#ffe28a':mix('#a8c4e8','#6a7aa8',td.n))}
 o=cam*.6;for(let i=Math.floor(o/160)-1;i<(o+480)/160+2;i++){const x=i*160-o;r(x,140,4,100,'#3a3a4a');r(x-12,150,28,3,'#3a3a4a');r(x-12,162,28,3,'#3a3a4a');
  if(H(i+5)>.4){r(x+40,168,56,26,mix('#e8709c','#ff4aa0',td.n));r(x+43,171,50,20,'#fff3');txt(['ラーメン','カフェ','居酒屋','ゲーム'][i&3],x+68,186,11,'#fff')}
  r(x+110,204,20,32,'#d84a3a');r(x+113,208,14,12,td.n>.5?'#ffe28a':'#bfe6ff')}
 r(0,236,480,26,'#bcb6a8');for(let x=-(cam%32);x<480;x+=32)r(x,236,2,26,'#a8a498');r(0,262,480,8,'#3a3a4a');
 bld(1110,100,'#e8709c','HAIR');bld(1290,100,'#5c9ae0','PILLOW');bld(2650,120,'#d84a3a','SUSHI');bld(3350,120,'#8a5a3c','HOME');
 const px=1940-cam;r(px,250,320,20,'#58b4e6');for(let i=0;i<8;i++)r(px+10+i*40+Math.sin(t*2+i)*4,256,16,2,'#bfe8ff');r(px,244,320,4,'#8a5a30');txt('FISH',FD-cam,236,11,'#6b4423');
 const e=EV[ev];
 if(e.k=='indiv'){const yx=SD-cam,sx=PD-cam;txt('유우시: 헤어',yx,112,13,'#fff');txt('사쿠야: 베개',sx,112,13,'#fff');
  bar(yx-30,120,60,(M.yn||0)/14,'#ff5c9c');txt(M.yok?'OK!':'연타!',yx,146,13,'#fff');
  r(sx-40,120,80,8,'#fff');r(sx-9,120,18,8,'#30c850');r(sx-41+Math.round((M.sp||0)*80),117,3,14,'#e0304a');txt(M.sok?'OK!':'초록에서 눌러!',sx,146,13,'#fff')}
 if(e.k=='fish'){if(M.f=='bite')txt('!',FD-cam,170,40,'#ff3050');else if(M.f=='wait')txt('…',FD-cam,170,28,'#fff');
  txt(M.f&&M.f!='idle'||(M.rd>0)?'느낌표가 뜨면 동시에! ('+(M.rd||0)+'/2)':'둘이 같이 낚시터로!',FD-cam,130,13,'#fff')}
 if(e.k=='run'&&cam>2300)txt('둘이 모이면 시작!',SH-cam,110,13,'#fff');
 if(ev==0&&cam<200)txt('→ 오른쪽으로 걸어가자!',240,70,14,'#fff');txt('빈 화면을 터치하면 행동!',240,92,12,'#fff')}
function drawRun(){const td=tod(2650);NN=td.n;sky(td);
 let o=cam*.15;for(let i=Math.floor(o/300)-1;i<(o+480)/300+2;i++)hill(i*300-o+150,80+H(i)*40,'#b8dca8');
 o=cam*.35;for(let i=Math.floor(o/200)-1;i<(o+480)/200+2;i++)hill(i*200-o+100,50+H(i+9)*40,'#6cbc58');
 r(0,240,480,30,'#e8913c');for(let y=250;y<270;y+=8)for(let x=-(cam%24)-24;x<480;x+=24)r(x+((y/8)%2)*12,y,12,3,'#f6b860');r(0,240,480,6,'#5ac838');r(0,240,480,2,'#8af058');
 OBS.forEach(b=>{const x=b.x-cam;if(x>480||x+b.w<0)return;if(b.h>=36){r(x,GY-b.h,b.w,b.h,'#30a060');r(x-2,GY-b.h,b.w+4,8,'#40c070');r(x+4,GY-b.h+8,4,b.h-8,'#60e090')}
  else{r(x,GY-b.h,b.w,b.h,'#c85a28');r(x,GY-b.h+13,b.w,2,'#7a3010');for(let k=0;k<b.w;k+=14)r(x+k,GY-b.h,2,13,'#7a3010')}});
 RC.forEach((c,i)=>{if(!(M.rc&&M.rc[i])){const b=Math.sin(t*5+c.x)*2;r(c.x-cam-5,c.y+b,10,12,'#ffd028');r(c.x-cam-2,c.y+b+2,4,8,'#fff08a')}});
 const x=GOAL-cam;r(x,GY-90,4,90,'#fff');r(x+4,GY-90,36,22,'#e03040');txt('GOAL',x+22,GY-74,11,'#fff');
 if(mt>0&&msg)0}
function drawHome(){r(0,0,480,270,'#2e2250');r(0,200,480,70,'#7a5a3a');r(300,40,120,90,'#10143a');r(304,44,112,82,'#1c2260');for(let i=0;i<14;i++)r(310+(i*37)%100,50+(i*23)%70,3,3,'#ffe28a');
 r(60,120,110,80,'#222');r(66,126,98,66,'#40b0ff');r(70,130,90,58,'#8ad8ff');txt('GAME',115,165,14,'#fff');r(220,170,160,40,'#a04a6a');
 [[0,250],[1,300]].forEach(([i,x])=>{const im=OS(P[i].n);if(im)g.drawImage(im,x,173)})}
function players(){P.slice().sort((a,b)=>a.y-b.y).forEach(p=>{const im=OS(p.n);if(!im)return;const bob=p.mvT&&p.y>=GY?Math.abs(Math.sin(p.mvT*14))*-3:0,x=Math.round(p.x-cam);
  r(x-10,p.y-2,20,4,'#0004');g.save();g.translate(x,0);if(p.fl)g.scale(-1,1);g.drawImage(im,-im.width/2,Math.round(p.y-51+bob));g.restore();
  if(p.id==local){const c=p.id?'#40b0ff':'#ff5c9c',b=Math.sin(t*6)*3,ay=p.y-64+b;r(x-6,ay,12,4,c);r(x-4,ay+4,8,4,c);r(x-2,ay+8,4,4,c);txt('나',x,ay-3,12,c)}})}
function draw(){if(!P.length){g.fillStyle='#8b9be0';g.fillRect(0,0,480,270);return}
 if(sc=='home')drawHome();else{sc=='run'?drawRun():drawStreet();players()}
 r(4,4,230,22,'#1b1838cc');txt('COIN '+score+'/10'+(sc=='run'&&M.rc?'  (이번 '+M.rc.reduce((a,b)=>a+b,0)+'/6)':''),10,20,13,'#ffd028','left');
 if(mt>0&&msg)txt(msg,240,64,18,'#ffee40');
 if(paused&&started&&$('ov').style.display=='none')txt('상대를 기다리는 중…',240,130,16,'#fff');
 if(fadeA>0){g.globalAlpha=fadeA;r(0,0,480,270,'#fff');g.globalAlpha=1;fadeA=Math.max(0,fadeA-DT*2)}}
function loop(now){DT=Math.min(.05,(now-last)/1000||0);last=now;t+=DT;if(started&&!paused){if(mt>0&&!isHost)mt-=DT;update(DT)}netTick(DT);draw();requestAnimationFrame(loop)}
title();requestAnimationFrame(loop);
