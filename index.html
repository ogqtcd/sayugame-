 bld(1110,100,'#e8709c','HAIR');bld(1290,100,'#5c9ae0','PILLOW');bld(2650,120,'#d84a3a','SUSHI');bld(3350,120,'#8a5a3c','HOME');
 const px=1940-cam;if(px<VW&&px+340>0){r(px,244,320,26,'#58b4e6');for(let i=0;i<8;i++)r(px+10+i*40+Math.sin(t*2+i)*4,252,16,2,'#bfe8ff');r(px-10,238,340,8,'#a8703a');for(let i=0;i<340;i+=12)r(px-10+i,238,2,8,'#7a4a1a');r(px-10,238,340,2,'#d8a060');txt('FISH',FD-cam,230,12,'#fff')}
 g.globalCompositeOperation='multiply';g.fillStyle=tint(cam+VW/2);g.fillRect(0,0,VW,270);g.globalCompositeOperation='source-over';
 if(td.n>.6){g.globalAlpha=Math.min(1,(td.n-.6)*3);for(let i=0;i<24;i++)r((i*97)%VW,(i*41)%110,2,2,'#fff');g.globalAlpha=1}
 const e=EV[ev];
 if(e.k=='indiv'){const yx=SD-cam,sx=PD-cam;txt(L('n1')+': '+L('hair'),yx,112,12,'#fff');txt(L('n0')+': '+L('pil'),sx,112,12,'#fff');

 if(e.k=='run'&&cam>2300)txt(L('gather'),SH-cam,110,12,'#fff')}

 let o=cam*.1;for(let i=Math.floor(o/190)-1;i<(o+VW)/190+2;i++)cloud(i*190-o,30+H(i+4)*60);

 r(60,120,110,80,'#222');r(66,126,98,66,'#40b0ff');r(70,130,90,58,'#8ad8ff');txt('GAME',115,165,12,'#fff');r(220,170,160,40,'#a04a6a');
 [[0,250],[1,300]].forEach(([i,x])=>{const im=OS(P[i].n);if(im)g.drawImage(im,x,173)});g.restore()}

function drawFish(){
  // full pier background
  if(FISHBG.naturalWidth){
    const scale=Math.max(VW/FISHBG.naturalWidth, 270/FISHBG.naturalHeight);
    const dw=FISHBG.naturalWidth*scale, dh=FISHBG.naturalHeight*scale;
    g.drawImage(FISHBG, (VW-dw)/2, (270-dh)/2, dw, dh);
  } else {
    r(0,0,VW,270,'#3a8ad8'); r(0,180,VW,90,'#2a6aaa');
  }
  // place both characters sitting on the pier (center-ish)
  const seats=[[VW*0.42, 195],[VW*0.58, 195]];
  P.forEach((p,i)=>{
    const im=OS(p.n); if(!im)return;
    const [sx,sy]=seats[i];
    g.save(); g.translate(Math.round(sx),0);
    if(p.fl) g.scale(-1,1);
    // slightly smaller / lower for "sitting" feel
    g.drawImage(im, -im.width/2, Math.round(sy-48), im.width, im.height);
    g.restore();
    if(p.id==local){
      const c=p.id?'#40b0ff':'#ff5c9c';
      txt(L('me'), sx, sy-58, 12, c);
    }
  });
  // mission UI
  if(M.f=='bite') txt('!', VW/2, 90, 40, '#ff3050', 'center', 1);
  else if(M.f=='wait') txt('…', VW/2, 100, 28, '#fff');
  const hint = (M.f && M.f!='idle') || (M.rd>0) ? L('fishHint').replace('{n}', M.rd||0) : L('fishGo');
  txt(hint, VW/2, 55, 14, '#fff', 'center', 1);
}

title();requestAnimationFrame(loop);
